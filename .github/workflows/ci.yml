name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.26.x', 'stable'] # 1.26 is the go.mod floor (HertaSDK)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go.mod is tidy
        shell: bash
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The end-to-end tests run a fake harness: no harness CLI or tokens needed.
      - run: go test -race -count=1 ./...
